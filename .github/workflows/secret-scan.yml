name: secret-scan

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

jobs:
  secret-scan:
    name: Never-commit secret scan (code-plan C9 + external-plan X7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/src" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --no-git --source=/src --redact --no-banner --config=/src/.gitleaks.toml
      - name: repo secret name/content scan
        run: python3 scripts/secret-scan.py
      - name: secret-scan rule self-test (planted samples must trip, templates must stay clean)
        run: python3 scripts/test_secret_scan.py
