# Never-commit secret-scan hook (code-plan C9).
#
# Install with `pre-commit install` (requires the pre-commit package), or run
# scripts/install-pre-commit-secret-scan.sh to install the equivalent plain
# git hook with no extra tooling. The hook blocks commits that stage secret
# material (env files, private keys, API tokens) and prints offending paths
# with values redacted.
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret-scan (never-commit guardrails, code-plan C9)
        entry: python3 scripts/secret-scan.py --staged
        language: system
        always_run: true
        pass_filenames: false
