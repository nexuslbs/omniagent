# model_prices.yml - USD per 1,000,000 tokens, ONE price class per model.
#
# SINGLE source of truth for LLM token pricing, shared by the omniagent core
# (`src/agent/pricing.rs`) and the dsh/workstation cost accounting
# (`workstation-plugins/shared/pricing.ts` + `shared/usage.ts`). Editing a rate
# here changes FUTURE costs with NO rebuild, NO release and NO restart: the file
# is re-read on every cost computation.
#
# ONE PRICE CLASS PER MODEL (operator, telegram 2026-10-03): the earlier
# time-aware, vendor-coupled pricing layer was REMOVED. There is no time
# dimension, no schedule, no window, no holiday calendar and no class selector:
# a model has exactly one rate set and every call to that model is priced with
# it.
#
# SHAPE: providers -> provider -> model -> canonical rates.
#
# Canonical keys (EXACT names, no aliases), USD per 1,000,000 tokens:
#   input         uncached (cache-miss) input tokens
#   cached_input  cache-READ (cache-hit) tokens. This is the canonical name,
#                 matching the `cached_input_tokens` field both sides already
#                 emit. The dsh-internal spelling `cache_read` is NOT a valid
#                 key here.
#   output        output tokens
#   cache_write   cache-write tokens
#   reasoning     OPTIONAL reasoning tokens; when absent, reasoning is billed
#                 inside `output`, exactly as the core does today (no separate
#                 reasoning term).
#
# STRICT SCHEMA (operator correction, telegram 2026-10-03): the schema above is
# the ONLY schema. ANY other key - at the file level, the provider level, the
# model level or the rate level - makes the file INVALID. In particular a file
# that still carries any of the removed time-aware keys (the file-level
# calendar block, the per-route discount multiplier, window / weekday / holiday
# settings, any class selector) is REJECTED: it is never read with the extra
# keys ignored, and no class selection may ever happen.
#
# INVALID FILE -> COST NOT STORED, WARNING, NEVER A FAILED TASK: an invalid or
# unparseable file never panics, never fails a task and never surfaces an error
# to the agent or the user. The affected usage entries simply carry NO cost (it
# is not stored) and a WARNING naming the reason is logged. An ABSENT or EMPTY
# file is unchanged: every computed cost is the plain number 0, with the reason
# recorded in `pricing_ref`. A route absent from a VALID file is UNPRICED ->
# cost null (an unknown price is never fabricated as 0).
#
# `aliases:` maps a provider spelling to the provider key that carries its
# prices (one hop, never a chain).
#
# Seeded 2026-10-03 with `price_table_v3` (single-class table; the time-aware
# `price_table_v2` layer was removed).

version: price_table_v3

providers:
  deepseek:
    deepseek-flash:
      input: 0.30
      cached_input: 0.006
      output: 1.20
      cache_write: 0.30
      reasoning: 1.20
    deepseek-v4-flash:
      input: 0.30
      cached_input: 0.006
      output: 1.20
      cache_write: 0.30
      reasoning: 1.20
    deepseek-v4.1-flash:
      input: 0.30
      cached_input: 0.006
      output: 1.20
      cache_write: 0.30
      reasoning: 1.20
    deepseek-v4-pro:
      input: 1.32
      cached_input: 0.044
      output: 3.96
      cache_write: 1.32
      reasoning: 3.96
  google:
    gemini-2.5-flash:
      input: 0.30
      cached_input: 0.03
      output: 2.50
      cache_write: 0.30

# Provider spellings that carry no rates of their own: they resolve to the
# provider key that does.
aliases:
  deepseek-official: deepseek
  opencode-go: deepseek
