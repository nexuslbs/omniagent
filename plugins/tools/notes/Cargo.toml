[package]
name = "mcp-server-notes"
version = "0.1.0"
edition = "2021"
description = "Durable working-memory notes MCP server: thread-sandboxed note write/read/list/rm tools"

[dependencies]
mcp-server-util = { path = "../util" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
