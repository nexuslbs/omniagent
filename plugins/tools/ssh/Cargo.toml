[package]
name = "mcp-server-ssh"
version = "0.1.0"
edition = "2021"
description = "SSH MCP server: ssh_run, ssh_copy, ssh_status - run commands on and copy files to/from remote machines"

[dependencies]
mcp-server-util = { path = "../util" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio"] }
