[package]
name = "mcp-server-search"
version = "0.1.0"
edition = "2021"
description = "Search MCP server: message/wiki keyword search, read-only SQL, thread/channel retrieval, metrics"

[dependencies]
mcp-server-util = { path = "../util" }
omniagent = { path = "../../../" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "chrono", "uuid", "json"] }
sql-forge = "0.5.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
parking_lot = "0.12"
